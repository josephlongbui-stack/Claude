appId: dev.killerqueen.app
---
# Expects a seeded task that the simulated runner settles (SIMULATED_RUNNER_DELAY_MS small).
- launchApp
- tapOn: "Arena"
- tapOn:
    id: "tab-settled"
- tapOn:
    id: "task-row-.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "settlement"
    timeout: 60000
